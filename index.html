<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>AR Künstler-Projektionshilfe</title>
    
    <!-- A-Frame und AR.js -->
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>

    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: sans-serif;
            background: transparent;
        }

        /* WICHTIG: Erzwingt, dass das AR.js Video im Hintergrund liegt und sichtbar ist */
        video {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            width: 100% !important;
            height: 100% !important;
            object-fit: cover !important;
            z-index: 1 !important;
        }

        /* A-Frame Canvas muss transparent sein, damit das Video durchschimmert */
        .a-canvas {
            position: absolute !important;
            top: 0 !important;
            left: 0 !important;
            z-index: 2 !important;
            background: transparent !important;
        }

        /* UI-Steuerung über dem AR-Canvas */
        #ui-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(0, 0, 0, 0.75);
            padding: 15px;
            border-radius: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            width: 85%;
            max-width: 400px;
            color: white;
            box-shadow: 0 4px 10px rgba(0,0,0,0.5);
        }

        .control-group {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .control-group label {
            font-size: 12px;
            display: flex;
            justify-content: space-between;
        }

        input[type=range] {
            width: 100%;
            cursor: pointer;
        }

        #file-upload-label {
            background: #007bff;
            color: white;
            padding: 8px;
            text-align: center;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }

        #file-input {
            display: none;
        }

        #info-overlay {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 99999;
            background: rgba(0, 0, 0, 0.7);
            color: #ffcc00;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            text-align: center;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <div id="info-overlay">Suche Marker (Hiro)...</div>

    <!-- AR-Szene -->
    <a-scene embedded arjs="sourceType: webcam; sourceWidth: 1280; sourceHeight: 960; displayWidth: 1280; displayHeight: 960; debugUIEnabled: false;" vr-mode-ui="enabled: false">
        
        <!-- Marker K1 (Hiro-Standard) -->
        <a-marker preset="hiro" id="marker-k1">
            <a-plane id="graphic-g1" position="0 0 0" rotation="-90 0 0" width="2" height="1.5" material="src: url(https://via.placeholder.com/800x600.png?text=Grafik+G1); transparent: true; opacity: 0.8;"></a-plane>
        </a-marker>

        <a-entity camera></a-entity>
    </a-scene>

    <!-- Bedien-UI -->
    <div id="ui-container">
        <label id="file-upload-label" for="file-input">📁 Grafik G1 auswählen</label>
        <input type="file" id="file-input" accept="image/*">

        <div class="control-group">
            <label><span>Transparenz Grafik (G1)</span><span id="val-g1">80%</span></label>
            <input type="range" id="range-g1" min="0" max="1" step="0.05" value="0.8">
        </div>

        <div class="control-group">
            <label><span>Helligkeit Video (V1)</span><span id="val-v1">100%</span></label>
            <input type="range" id="range-v1" min="0.2" max="2" step="0.05" value="1">
        </div>
    </div>

    <script>
        // Logik für Datei-Upload
        const fileInput = document.getElementById('file-input');
        const graphicG1 = document.getElementById('graphic-g1');

        fileInput.addEventListener('change', function(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    graphicG1.setAttribute('material', 'src', e.target.result);
                };
                reader.readAsDataURL(file);
            }
        });

        // Schieberegler G1 Opazität
        const rangeG1 = document.getElementById('range-g1');
        const valG1 = document.getElementById('val-g1');

        rangeG1.addEventListener('input', (e) => {
            const opacity = e.target.value;
            valG1.innerText = Math.round(opacity * 100) + '%';
            const currentMat = graphicG1.getAttribute('material');
            currentMat.opacity = opacity;
            graphicG1.setAttribute('material', currentMat);
        });

        // Schieberegler V1 Helligkeit
        const rangeV1 = document.getElementById('range-v1');
        const valV1 = document.getElementById('val-v1');

        rangeV1.addEventListener('input', (e) => {
            const val = e.target.value;
            valV1.innerText = Math.round(val * 100) + '%';
            const videoEl = document.querySelector('video');
            if (videoEl) {
                videoEl.style.filter = `brightness(${val})`;
            }
        });

        // Status-Updates für Marker
        const marker = document.getElementById('marker-k1');
        const infoOverlay = document.getElementById('info-overlay');

        marker.addEventListener('markerFound', () => {
            infoOverlay.innerText = "Leinwand K1 erkannt!";
            infoOverlay.style.color = "#00ff66";
        });

        marker.addEventListener('markerLost', () => {
            infoOverlay.innerText = "Suche Marker (Hiro)...";
            infoOverlay.style.color = "#ffcc00";
        });
    </script>
</body>
</html>
